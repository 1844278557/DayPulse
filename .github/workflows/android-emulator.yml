name: Android Emulator Smoke Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/siliconflow-audio-asr]
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Enable KVM on Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            adb shell screencap -p /sdcard/daypulse-smoke.png
            adb pull /sdcard/daypulse-smoke.png daypulse-smoke.png

      - name: Upload emulator test reports and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daypulse-emulator-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            daypulse-smoke.png
          if-no-files-found: warn
